name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Michael & Donnah APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout love-story repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile-build/package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Create Capacitor Android wrapper
        shell: bash
        run: |
          set -euo pipefail

          rm -rf mobile-build
          mkdir -p mobile-build/www

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='mobile-build/' \
            --exclude='android/' \
            --exclude='node_modules/' \
            ./ mobile-build/www/

          cd mobile-build

          npm init -y
          npm install @capacitor/core @capacitor/android
          npm install --save-dev @capacitor/cli

          cat > capacitor.config.ts <<'EOF2'
          import type { CapacitorConfig } from "@capacitor/cli";

          const config: CapacitorConfig = {
            appId: "com.michael.donnah.lovestory",
            appName: "Michael & Donnah Love Story",
            webDir: "www",
            bundledWebRuntime: false
          };

          export default config;
          EOF2

          npx cap add android
          npx cap sync android

      - name: Configure APK ABI outputs
        shell: bash
        run: |
          set -euo pipefail
          APP_GRADLE="mobile-build/android/app/build.gradle"

          cat >> "$APP_GRADLE" <<'EOF2'

          // Michael & Donnah: build installable APKs for common Android ABIs.
          android {
              splits {
                  abi {
                      enable true
                      reset()
                      include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
                      universalApk true
                  }
              }
          }
          EOF2

      - name: Build Android debug APKs
        working-directory: mobile-build/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Collect APK files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/android

          find mobile-build/android/app/build/outputs/apk/debug \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print \
            -exec cp {} artifacts/android/ \;

          test -n "$(find artifacts/android -maxdepth 1 -name '*.apk' -print -quit)"

          echo "Built APKs:"
          ls -lh artifacts/android/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: michael-donnah-android-apks
          path: artifacts/android/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: artifacts/android/*.apk
