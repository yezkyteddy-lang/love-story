name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Michael & Donnah APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout love-story repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Create Capacitor project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf mobile-build
          mkdir -p mobile-build/www

          # Copy the existing GitHub Pages website into the temporary app.
          rsync -a             --exclude='.git/'             --exclude='.github/'             --exclude='mobile-build/'             --exclude='android/'             --exclude='node_modules/'             ./ mobile-build/www/

          cd mobile-build

          npm init -y
          npm install @capacitor/core @capacitor/android
          npm install --save-dev @capacitor/cli

          # JSON config avoids requiring TypeScript just to run Capacitor.
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.michael.donnah.lovestory",
            "appName": "Michael & Donnah Love Story",
            "webDir": "www"
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: Build universal Android APK
        working-directory: mobile-build/android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts/android

          APK_PATH="mobile-build/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "Expected APK was not found."
            echo "Searching for APK files:"
            find mobile-build/android/app/build/outputs -type f -name "*.apk" -print || true
            exit 1
          fi

          cp "$APK_PATH" "artifacts/android/Michael-Donnah-Love-Story-debug.apk"

          ls -lh artifacts/android/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: michael-donnah-android-apk
          path: artifacts/android/Michael-Donnah-Love-Story-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: artifacts/android/Michael-Donnah-Love-Story-debug.apk
